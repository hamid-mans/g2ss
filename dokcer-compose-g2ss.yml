 app:
    image: fbs124/g2ss-app:latest  # <--- On utilise l'image que tu viens de push
    container_name: g2ss-app
    # On enlève toute la partie "build:" car l'image est déjà prête
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://g2ss:g2ss@db:3306/g2ss?serverVersion=8.0&charset=utf8mb4"
      MAILER_DSN: "smtp://mailer:1025"
      APP_ENV: "prod"
    entrypoint: /app/entrypoint.sh
    command: sh -lc "php -S 0.0.0.0:8000 -t public"
    ports:
      - "8080:8000"

  mailer:
    image: axllent/mailpit
    container_name: g2ss-mailer
    restart: always
    ports:
      - "8025:8025"

volumes:
  db_data: {}
