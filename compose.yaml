services:
  db:
    image: mysql:8.0
    container_name: g2ss-db
    environment:
      MYSQL_ROOT_PASSWORD: g2ss
      MYSQL_DATABASE: g2ss
      MYSQL_USER: g2ss
      MYSQL_PASSWORD: g2ss
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pg2ss"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql

  # ✅ One-shot: crée le schéma / exécute les migrations, puis s'arrête.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: g2ss-migrate
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://g2ss:g2ss@db:3306/g2ss?serverVersion=8.0&charset=utf8mb4"
      MAILER_DSN: "smtp://mailer:1025"
    command: >
      sh -lc "
        php bin/console doctrine:migrations:migrate --no-interaction
        || php bin/console doctrine:schema:update --force
      "
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: g2ss-app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      # (Optionnel) si ton Portainer/compose supporte "service_completed_successfully"
      # migrate:
      #   condition: service_completed_successfully
    environment:
      DATABASE_URL: "mysql://g2ss:g2ss@db:3306/g2ss?serverVersion=8.0&charset=utf8mb4"
      MAILER_DSN: "smtp://mailer:1025"
    ports:
      - "8080:8000"

  mailer:
    image: axllent/mailpit
    container_name: g2ss-mailer
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data: {}
