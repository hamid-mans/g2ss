version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: g2ss-db
    environment:
      MYSQL_ROOT_PASSWORD: g2ss
      MYSQL_DATABASE: g2ss
      MYSQL_USER: g2ss
      MYSQL_PASSWORD: g2ss
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pg2ss"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql

  app:
    image: ghcr.io/TON_ORG/g2ss-app:latest   # ⬅️ image pré-buildée
    pull_policy: always
    container_name: g2ss-app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://g2ss:g2ss@db:3306/g2ss?serverVersion=8.0&charset=utf8mb4"
      MAILER_DSN: "smtp://mailer:1025"
    ports:
      - "8080:8000"

  mailer:
    image: axllent/mailpit
    container_name: g2ss-mailer
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
